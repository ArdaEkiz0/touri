.tb-av{position:relative;flex-shrink:0;display:block}
.tb-idle{animation:tb-bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.tb-busy{animation:tb-work .9s ease-in-out infinite;transform-origin:50% 90%}
.tb-eye{animation:tb-blink 4.5s infinite;transform-box:fill-box;transform-origin:center}

.tb-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid #0a84ff;animation:tb-ring 1.4s ease-out infinite}
.tb-typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a1a1a6;margin-right:4px;animation:tb-dot 1.2s infinite}

.tb-feed>div{animation:tb-in .35s ease-out both}
.tb-row:hover{background:#2a2a2c}

isTri: b.shape === 'tri', isBlob: b.shape === 'blob', isBull: b.shape === 'bull',
motion: b.busy ? 'tb-busy' : 'tb-idle',
rowStyle: 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 12px; cursor: pointer; color: inherit; background: ' + (selected ? '#2c2c2e' : 'transparent'),
pick: () => this.setState({ picked: b.id }),
threads: b.threads.map((t, i) => ({ title: t[0], badge: t[1], style: 'display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: #e5e5ea; background: ' + (i === 0 ? '#3a3a3c' : 'transparent') }))
};
});
const cur = bots.find((b) => b.selected) || bots[0];
const navLabel = (navDefs.find((n) => n[0] === this.state.nav) || navDefs[0])[1];
return {
isTouri: tab === 'touri',
isBots: tab === 'bots',
tabTouri: { pick: () => this.setState({ tab: 'touri' }), style: tabStyle(tab === 'touri') },
tabBots: { pick: () => this.setState({ tab: 'bots' }), style: tabStyle(tab === 'bots') },
navItems,
bots,
crumb: tab === 'touri' ? 'touri / ' + navLabel : 'Bots / ' + cur.name,
current: {
name: cur.name, color: cur.color, busy: cur.busy, motion: cur.motion, model: cur.model, placeholder: 'Mensagem para ' + cur.name,
feed: cur.feed.map((f, i) => ({ ...f, delay: 'animation-delay: ' + (i * 60) + 'ms' }))
}
};
}
}
</script>
</body>
